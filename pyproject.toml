[project]
name = "stu"
version = "3.0.0"
description = "Project Stu v3.0 local-first agentic workstation"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "loguru>=0.7.2",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "mcp>=1.0.0",
    "lancedb>=0.17.0",
    "sentence-transformers>=3.0.0",
    "aisuite @ git+https://github.com/andrewyng/aisuite@531b5b840669776948bdb9ce4ac2da2dfa9c80f3",
]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stu"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true
